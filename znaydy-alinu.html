<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Знайди Аліну</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f2ea;
    --ink:#3a3128;
    --rose:#c9647a;
    --gold:#c79a4e;
    --card-shadow:rgba(58,49,40,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Montserrat',sans-serif;
    background:radial-gradient(120% 60% at 50% 0%,rgba(201,100,122,.10),transparent 55%),var(--bg);
    color:var(--ink);min-height:100svh;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
  header{text-align:center;margin-bottom:22px}
  .eyebrow{font-size:.68rem;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:10px}
  h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,8vw,3rem);font-weight:600;line-height:1.05;color:var(--ink)}
  .sub{margin-top:10px;font-size:.95rem;color:#7a6f61}
  .shuffle{
    margin-top:16px;background:var(--rose);color:#fff;border:none;
    border-radius:999px;padding:11px 26px;font-family:'Montserrat',sans-serif;
    font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
    cursor:pointer;box-shadow:0 6px 18px rgba(201,100,122,.4);transition:transform .2s ease;
  }
  .shuffle:hover{transform:translateY(-2px)}
  .shuffle:active{transform:scale(.96)}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
  @media(max-width:420px){.grid{gap:9px}}
  .tile{
    position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;cursor:pointer;
    box-shadow:0 6px 18px var(--card-shadow);background:#ddd;border:3px solid #fff;
    transition:transform .2s ease,box-shadow .2s ease;
  }
  .tile:hover{transform:translateY(-3px);box-shadow:0 12px 26px var(--card-shadow)}
  .tile img{width:100%;height:100%;object-fit:cover;display:block}
  .tile .num{position:absolute;top:6px;left:8px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.1rem;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}

  .lb{position:fixed;inset:0;z-index:50;background:rgba(30,24,20,.92);display:none;align-items:center;justify-content:center;padding:20px}
  .lb.open{display:flex}
  .lb-inner{position:relative;max-width:560px;width:100%;display:flex;flex-direction:column;align-items:center;animation:pop .3s ease}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .lb-img{max-width:100%;max-height:74svh;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);border:4px solid #fff;cursor:pointer}
  .hint{margin-top:14px;color:rgba(255,255,255,.7);font-size:.82rem;letter-spacing:.04em}
  .caption{margin-top:16px;text-align:center;color:#fff;font-family:'Cormorant Garamond',serif;font-size:1.5rem;line-height:1.35;max-width:460px;text-shadow:0 2px 10px rgba(0,0,0,.4);display:none}
  .caption.show{display:block;animation:pop .3s ease}
  .caption.correct{color:#ffe6ee}
  .close{position:absolute;top:-14px;right:-6px;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--ink);border:none;font-size:1.3rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:3}
  .nav{display:flex;gap:14px;margin-top:20px}
  .nav button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:10px 22px;font-family:'Montserrat',sans-serif;font-size:.8rem;letter-spacing:.08em;cursor:pointer;transition:background .2s ease}
  .nav button:hover{background:rgba(255,255,255,.28)}

  .fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
  .fly{position:absolute;font-size:2.2rem;will-change:transform,opacity;user-select:none}
  @keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(-120svh) rotate(var(--rot));opacity:0}}
  @keyframes burst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:0}}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Весільний конкурс</div>
      <h1>Знайди свою наречену</h1>
      <p class="sub">Тут усі — маленькі. Одна з них — твоя Аліна. Тисни на фото!</p>
      <button class="shuffle" id="shuffleBtn">🔀 Перетасувати</button>
    </header>
    <div class="grid" id="grid"></div>
  </div>

  <div class="lb" id="lb">
    <div class="lb-inner">
      <button class="close" id="closeBtn" aria-label="Закрити">&times;</button>
      <img class="lb-img" id="lbImg" src="" alt="">
      <div class="hint" id="hint">Натисни на фото ще раз 👆</div>
      <div class="caption" id="caption"></div>
      <div class="nav">
        <button id="prevBtn">&larr; Назад</button>
        <button id="nextBtn">Далі &rarr;</button>
      </div>
    </div>
  </div>

  <div class="fx" id="fx"></div>

const grid=document.getElementById('grid');
const lb=document.getElementById('lb');
const lbImg=document.getElementById('lbImg');
const caption=document.getElementById('caption');
const hint=document.getElementById('hint');
const fx=document.getElementById('fx');
let order=PHOTOS.map((_,i)=>i);
let current=0;      // index within order
let revealed=false; // whether captions/effects shown for current

const MASHA_CAPTION="Це не Аліна 😄 Це її сестричка Маша — гроза лісових паличок і майбутня опора родини 🌲🥢";
const ALINA_CAPTION="💖 ОСЬ ВОНА! 💖 Твоя Аліна 👰 Впізнав з першого погляду? 😘";
const POOP_CAPTIONS=["Не вона! 💩 Дивись уважніше 😆","Мимо 💩 Це точно не твоя наречена!","Ні-ні-ні 💩 Аліна десь поруч!","Промах 💩 Спробуй ще раз!"];

function buildGrid(){
  grid.innerHTML='';
  order.forEach((pi,slot)=>{
    const p=PHOTOS[pi];
    const tile=document.createElement('div');
    tile.className='tile';
    tile.innerHTML='<span class="num">'+(slot+1)+'</span><img src="'+p.src+'" alt="фото">';
    tile.addEventListener('click',()=>open(slot));
    grid.appendChild(tile);
  });
}

function open(slot){
  current=slot;
  revealed=false;
  const p=PHOTOS[order[slot]];
  lbImg.src=p.src;
  caption.className='caption';
  caption.textContent='';
  hint.style.display='block';
  lb.classList.add('open');
}

function reveal(){
  if(revealed) return;
  revealed=true;
  hint.style.display='none';
  const type=PHOTOS[order[current]].type;
  if(type==='alina'){
    caption.className='caption correct show';
    caption.textContent=ALINA_CAPTION;
    fireworks(); kisses();
  }else if(type==='masha'){
    caption.className='caption show';
    caption.textContent=MASHA_CAPTION;
  }else{
    caption.className='caption show';
    caption.textContent=POOP_CAPTIONS[Math.floor(Math.random()*POOP_CAPTIONS.length)];
    poops();
  }
}

function close(){lb.classList.remove('open');fx.innerHTML='';}

function spawn(emoji,x,y,anim,extra){
  const el=document.createElement('div');el.className='fly';el.textContent=emoji;
  el.style.left=x+'px';el.style.top=y+'px';
  for(const k in extra){el.style.setProperty(k,extra[k]);}
  el.style.animation=anim;fx.appendChild(el);
  setTimeout(()=>el.remove(),2600);
}
function poops(){for(let i=0;i<18;i++){setTimeout(()=>{const x=Math.random()*innerWidth,y=innerHeight-20,dur=(1.6+Math.random()*1.2).toFixed(2)+'s';spawn('💩',x,y,'floatUp '+dur+' ease-out forwards',{'--rot':(Math.random()*720-360)+'deg'});},i*70);}}
function kisses(){const e=['💋','😘','💖','💕'];for(let i=0;i<22;i++){setTimeout(()=>{const x=Math.random()*innerWidth,y=innerHeight-20,dur=(1.8+Math.random()*1.4).toFixed(2)+'s';spawn(e[Math.floor(Math.random()*e.length)],x,y,'floatUp '+dur+' ease-out forwards',{'--rot':(Math.random()*360-180)+'deg'});},i*80);}}
function fireworks(){const cx=innerWidth/2,cy=innerHeight*0.4,s=['🎆','🎇','✨','⭐','🌟'];for(let b=0;b<3;b++){setTimeout(()=>{const bx=cx+(Math.random()*300-150),by=cy+(Math.random()*160-80);for(let i=0;i<14;i++){const a=(Math.PI*2/14)*i,d=90+Math.random()*70;spawn(s[Math.floor(Math.random()*s.length)],bx,by,'burst '+(1+Math.random()*0.6).toFixed(2)+'s ease-out forwards',{'--dx':Math.cos(a)*d+'px','--dy':Math.sin(a)*d+'px'});}},b*400);}}

function shuffle(){
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  buildGrid();
}

lbImg.addEventListener('click',reveal);
document.getElementById('closeBtn').addEventListener('click',close);
document.getElementById('nextBtn').addEventListener('click',()=>open((current+1)%order.length));
document.getElementById('prevBtn').addEventListener('click',()=>open((current-1+order.length)%order.length));
document.getElementById('shuffleBtn').addEventListener('click',shuffle);
lb.addEventListener('click',(e)=>{if(e.target===lb)close();});
document.addEventListener('keydown',(e)=>{
  if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')close();
  if(e.key==='ArrowRight')open((current+1)%order.length);
  if(e.key==='ArrowLeft')open((current-1+order.length)%order.length);
  if(e.key===' '||e.key==='Enter'){e.preventDefault();reveal();}
});

buildGrid();
</script>
